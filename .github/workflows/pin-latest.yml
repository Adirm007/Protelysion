name: Pin latest
# 外链只允许完整 Commit SHA 的 GitHub raw 地址：每次推送后把 latest.json 与 install/ 外链正则固定到最新提交。
on:
  push:
    branches: [main]
    paths-ignore:
      - 'latest.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: protelysion-pin
  cancel-in-progress: false
jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            site/release-manifest.json
            install
            tools
            latest.json
          sparse-checkout-cone-mode: false
      - name: Pin latest.json and the external regex to the current full commit SHA
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TARGET=$(git rev-parse HEAD)
          python3 tools/pin_latest.py "$TARGET"
          git add latest.json install
          if git diff --cached --quiet; then echo "pin unchanged"; exit 0; fi
          git commit -m "Pin latest to ${TARGET:0:7} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
